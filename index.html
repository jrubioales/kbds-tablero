<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calificación KBDS</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4; --s1:#fcfcfb; --s2:#efefec; --line:#e2e1dc;
  --t1:#0b0b0b; --t2:#52514e; --t3:#7a7974;
  --acc:#2a78d6;
  --carbon:#52514e; --cuarzo:#6250d6; --esmeralda:#008300; --diamante:#2a78d6;
  --ok:#008300; --bad:#c62f2e; --nd:#a3a29c;
  --h0:#f1f0ec; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#184f95;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --s1:#1a1a19; --s2:#242423; --line:#33332f;
    --t1:#f0efec; --t2:#c3c2b7; --t3:#8f8e86;
    --acc:#3987e5;
    --carbon:#8f8e86; --cuarzo:#9085e9; --esmeralda:#0ca30c; --diamante:#3987e5;
    --ok:#3fb93f; --bad:#e66767; --nd:#6b6a64;
    --h0:#242423; --h1:#14325a; --h2:#184f95; --h3:#1c5cab; --h4:#2a78d6; --h5:#5598e7; --h6:#9ec5f4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --s1:#1a1a19; --s2:#242423; --line:#33332f;
  --t1:#f0efec; --t2:#c3c2b7; --t3:#8f8e86;
  --acc:#3987e5;
  --carbon:#8f8e86; --cuarzo:#9085e9; --esmeralda:#0ca30c; --diamante:#3987e5;
  --ok:#3fb93f; --bad:#e66767; --nd:#6b6a64;
  --h0:#242423; --h1:#14325a; --h2:#184f95; --h3:#1c5cab; --h4:#2a78d6; --h5:#5598e7; --h6:#9ec5f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--t2);font-size:13px}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:16px 0;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:10px;position:sticky;top:0;z-index:5}
.filtros label{display:flex;flex-direction:column;font-size:11px;color:var(--t2);gap:3px}
select,input[type=search],input[type=number]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--s1);color:var(--t1);min-width:120px}
input[type=number]{min-width:0;width:70px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:12px;border:0;background:var(--s1);color:var(--t2);padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--s1);color:var(--t1);padding:6px 10px;border-radius:6px;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--t2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.card h2{font-size:15px;margin:0 0 10px}
.dist{display:flex;height:26px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0}
.dist div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--t2)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{font:inherit;border:0;background:none;color:var(--t2);padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--t1);border-bottom-color:var(--acc);font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;cursor:pointer;user-select:none}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--s2)}
.bar{position:relative;height:8px;background:var(--s2);border-radius:4px;min-width:80px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--acc)}
.mini{display:flex;height:10px;gap:2px;min-width:110px;border-radius:3px;overflow:hidden}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:10px;font-weight:600;border:1px solid var(--line);color:var(--t2);margin-left:4px;white-space:nowrap}
.hm td.c{text-align:center;font-size:12px;min-width:62px;font-weight:600}
.hm th{white-space:normal;min-width:62px;text-align:center;vertical-align:bottom}
.hm th:first-child{text-align:left}
.muted{color:var(--t3)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.nd{color:var(--nd)}
.nota{font-size:12px;color:var(--t2);margin:8px 0 0}
.det{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.det.on{display:flex}
.det .box{background:var(--s1);border-radius:12px;max-width:760px;width:100%;padding:18px;border:1px solid var(--line)}
.tip{position:fixed;pointer-events:none;background:var(--t1);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:6px;display:none;z-index:30;max-width:280px}
b{font-weight:650}
@media (max-width:640px){.kpi .v{font-size:22px}.filtros{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Calificación KBDS</h1>
  <div class="sub" id="sub"></div>

  <div class="filtros">
    <label>Zona<select id="fz"></select></label>
    <label>Cadena<select id="fc"></select></label>
    <label>Formato<select id="ff"></select></label>
    <label>Cluster<select id="fl"></select></label>
    <label>Empresa<select id="fe"></select></label>
    <button class="btn" id="limpiar">Quitar filtros</button>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="card">
    <h2>Distribución de locales por calificación</h2>
    <div class="dist" id="dist"></div>
    <div class="leg" id="leg"></div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="grupo" class="on">Por zona / cadena</button>
    <button data-t="cat">Por categoría</button>
    <button data-t="lin">Por lineamiento</button>
    <button data-t="opo">Oportunidades</button>
    <button data-t="loc">Locales</button>
    <button data-t="metas">Metas SOS</button>
  </div>
  <div id="vista"></div>
</div>

<div class="det" id="det"><div class="box" id="detbox"></div></div>
<div class="tip" id="tip"></div>

  lin:"", ver:"no", dimO:"z", sortO:["z",1]};

// ---------- el valor de un lineamiento en un local: 1, 0 o null (no cuenta)
function valor(L, d){
  const v = L.r[d.k];
  if (v === undefined) return undefined;          // no aplica (cluster / empresa inactiva)
  if (d.bloque && v === 1 && L.sos[d.k]) return L.sos[d.k][0] >= d.meta ? 1 : 0;
  return v;
}
function lineas(L){
  const out = [];
  for (const d of D.kbds){
    if (st.e && d.emp !== st.e) continue;
    const v = valor(L, d);
    if (v === undefined) continue;
    out.push([d, v]);
  }
  return out;
}
function nota(L){
  const ls = lineas(L).filter(x => x[1] !== null);
  if (!ls.length) return null;
  const si = ls.filter(x => x[1] === 1).length;
  return {si, n: ls.length, p: Math.round(100 * si / ls.length), nd: lineas(L).length - ls.length};
}
function nivel(p){ for (const n of NIV) if (p >= n[0]) return n; return NIV[NIV.length-1]; }

// ---------- filtros
function filtrados(){
  return D.locales.filter(L => (!st.z || L.z === st.z) && (!st.c || L.c === st.c) &&

}

function calcular(){

function distBar(items, alto){
  const tot = items.reduce((a, x) => a + x[1], 0) || 1;
  return items.filter(x => x[1] > 0).map(([n, c]) =>
    `<div style="flex:${c};background:${NIVC[n[1]]};${alto?"":""}" data-tip="<b>${n[2]}</b>: ${c} locales (${Math.round(100*c/tot)}%)">${alto && c/tot > .06 ? c : ""}</div>`).join("");
}
function contarNiveles(lista){
  const m = Object.fromEntries(NIV.map(n => [n[1], 0]));
  lista.forEach(o => { if (o.nv) m[o.nv[1]]++; });
  return [...NIV].reverse().map(n => [n, m[n[1]]]);
}
const pctTxt = v => v === null || v === undefined || isNaN(v) ? "—" : Math.round(v) + "%";
function promedio(lista){ const c = lista.filter(o => o.nt); return c.length ? c.reduce((a, o) => a + o.nt.p, 0) / c.length : null; }

  <div class="sub">KBDS ${esc(L.fe)} por ${esc(L.per)} · SOS Percha ${L.sf ? esc(L.sf) : "<b>sin SOS del mes</b>"}</div></div>
  <button class="btn" onclick="document.getElementById('det').classList.remove('on')">Cerrar</button></div>
  <p>${nt ? `<span style="font-size:24px;font-weight:650">${nt.p}%</span> <span class="pill" style="background:${NIVC[nv[1]]}">${nv[2]}</span> <span class="muted">${nt.si} de ${nt.n} cumplidos${nt.nd ? " · " + nt.nd + " sin dato SOS" : ""}</span>` : "Sin lineamientos calificables"}</p>
  <p class="sub">Empresas activas: ${(L.act || []).map(e => esc(EMP[e])).join(", ") || "ninguna"}</p><table>`;
  for (const c of D.cats){
    const ls = D.kbds.filter(d => d.cat === c.k && (!st.e || d.emp === st.e)).map(d => [d, valor(L, d)]).filter(x => x[1] !== undefined);
    if (!ls.length) continue;
    h += `<tr><td colspan="3" style="background:var(--s2)"><b>${esc(c.label)}</b> <span class="muted">· ${esc(EMP[c.emp])}</span></td></tr>`;
    h += ls.map(([d, v]) => { const s = L.sos[d.k];
      const sTxt = s ? `${s[0]}% <span class="muted">(${Math.round(s[1])} de ${Math.round(s[2])} cm)</span>` : (d.fuente === "sos" || d.bloque ? '<span class="muted">sin SOS</span>' : "");
      const mk = v === 1 ? '<span class="ok">✓ Sí</span>' : v === 0 ? '<span class="bad">✗ No</span>' : '<span class="nd">— sin dato</span>';
      const armado = d.bloque && L.r[d.k] === 1 && v === 0 ? '<br><span class="muted" style="font-size:11px">armado, pero bajo la meta de SOS</span>' : "";
      return `<tr><td>${md(d.txt[L.j] || d.txt.hsm || d.txt.disc)}</td><td style="white-space:nowrap">${mk}${armado}</td><td class="n" style="white-space:nowrap">${sTxt}</td></tr>`; }).join("");
  }
  $("#detbox").innerHTML = h + "</table>";
  $("#det").classList.add("on");
}
$("#det").onclick = e => { if (e.target.id === "det") e.target.classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#det").classList.remove("on"); });

function descargar(){
  const cats = D.cats;
  const cab = ["codigo","local","zona","cadena","formato","cluster","estado","motivo","fecha_kbds","mercaderista","fecha_sos","calificacion_pct","nivel","cumplidos","evaluados", ...cats.map(c => c.label + " %")];
  const filas = CALC.map(o => { const L = o.L;
    return [L.id, L.n, L.z, L.c, L.f, L.cl, {ok:"levantado",no:"no se pudo",falta:"falta"}[L.est], L.mot || "", L.fe || "", L.per || "", L.sf || "",
      o.nt ? o.nt.p : "", o.nv ? o.nv[2] : "", o.nt ? o.nt.si : "", o.nt ? o.nt.n : "",
      ...cats.map(c => { const r = L.est === "ok" ? catPct([o], c.k) : null; return r ? Math.round(r[0]) : ""; })]; });
  const txt = [cab, ...filas].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + txt], {type: "text/csv"}));
  a.download = `KBDS calificacion ${D.mes}.csv`; a.click();
}
{ const t = location.hash.slice(1); if (["grupo","cat","lin","opo","loc","metas"].includes(t)){ st.tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === t)); } }
pintar();
</script>
